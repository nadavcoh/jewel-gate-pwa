name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Solver self-test (JS port vs. results of the Python original)
        run: node tests/selftest.js

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js js icons _site/
          # every deploy gets its own cache name, so installed copies see the update
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
